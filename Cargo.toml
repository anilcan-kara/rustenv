[package]
name = "rustenv"
version = "0.1.0"
edition = "2024"
authors = ["Anilcan Kara <anilcan@kara.dev>"]
description = "A fast, secure environment variable and secret management tool — written in Rust"
license = "MIT"
repository = "https://github.com/anilcan-kara/rustenv"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
colored = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
strip = true
